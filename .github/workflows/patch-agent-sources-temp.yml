name: temporary-agent-source-patch

on:
  push:
    branches:
      - codex/agent-source-refresh

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/agent-source-refresh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply source refresh
        shell: bash
        run: |
          python scripts/_patch_agent_sources_temp.py
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/prepare_trace_corpus.py')
          text = p.read_text()
          old = '''    if accepted_tokens < target_tokens:\n        raise RuntimeError(\n            f"{source.key} exhausted at {accepted_tokens:,} tokens; target={target_tokens:,}; "\n            f"drops={dict(drops)}"\n        )\n'''
          new = '''    exhausted_before_target = accepted_tokens < target_tokens\n    if exhausted_before_target and source.pool != "agent":\n        raise RuntimeError(\n            f"{source.key} exhausted at {accepted_tokens:,} tokens; target={target_tokens:,}; "\n            f"drops={dict(drops)}"\n        )\n'''
          if old not in text:
              raise SystemExit('collection exhaustion block not found')
          text = text.replace(old, new, 1)
          marker = '        "accepted_tokens_before_effort_relabel": accepted_tokens,\n'
          if marker not in text:
              raise SystemExit('collection stats marker not found')
          text = text.replace(marker, marker + '        "exhausted_before_target": exhausted_before_target,\n', 1)
          p.write_text(text)

          p = Path('tests/test_trace_source_selection.py')
          lines = p.read_text().splitlines()
          for i, line in enumerate(lines):
              if '"expected_action": {"type":"function_call","name":"get_project_status"' in line:
                  lines[i] = '        "expected_action": {"type": "function_call", "name": "get_project_status", "arguments": {"project_id": "CER-1122"}},'
                  break
          else:
              raise SystemExit('Nemotron expected_action fixture not found')
          p.write_text('\n'.join(lines) + '\n')

          p = Path('docs/corpus_8k_agent_data.md')
          text = p.read_text().replace(
              'Default materialization target: **16M accepted nano-tokenizer tokens**.',
              'Default soft materialization target: **16M accepted nano-tokenizer tokens**.',
              1,
          )
          text = text.replace(
              '**Target semantics.** The 16M agent value is only a corpus-construction default.',
              '**Target semantics.** The 16M agent value is only a corpus-construction default; verified agent sources may exhaust below their requested share without failing the build.',
              1,
          )
          p.write_text(text)
          PY
      - name: Install test dependencies
        run: pip install -e '.[dev]'
      - name: Validate source adapters
        run: |
          python -m py_compile scripts/prepare_trace_corpus.py
          pytest -q tests/test_trace_source_selection.py
      - name: Commit source refresh
        shell: bash
        run: |
          rm .github/workflows/patch-agent-sources-temp.yml scripts/_patch_agent_sources_temp.py
          rm -f .agent-source-refresh-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/prepare_trace_corpus.py docs/corpus_8k_agent_data.md docs/corpus_curriculum.md tests/test_trace_source_selection.py .github/workflows/patch-agent-sources-temp.yml scripts/_patch_agent_sources_temp.py .agent-source-refresh-trigger
          git commit -m "Replace legacy Nemotron SFT traces with verified agent sources"
          git push origin HEAD:codex/agent-source-refresh
