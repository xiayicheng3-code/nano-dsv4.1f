name: temporary-sft-source-patch

on:
  push:
    branches:
      - codex/sft-source-quality-fixes

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/sft-source-quality-fixes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply source-quality changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/_patch_sft_sources_temp.py')
          text = p.read_text()
          replacements = {
              'pattern, dedent(new_body).strip() + "\\n\\n", text, count=1, flags=re.S':
                  'pattern, lambda _: dedent(new_body).strip() + "\\n\\n", text, count=1, flags=re.S',
              'pattern = rf"def {name}\\(.*?(?=\\ndef {next_name}\\()"':
                  'pattern = rf"def {name}\\(.*?(?=\\n(?:def {next_name}\\(|{next_name}\\s*:))"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'temporary patch helper replacement target not found: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          python scripts/_patch_sft_sources_temp.py
      - name: Install test dependencies
        run: pip install -e '.[dev]'
      - name: Validate patched source selection
        run: |
          python -m py_compile scripts/prepare_reasoning_sft.py scripts/prepare_trace_corpus.py
          pytest -q tests/test_reasoning_sft_sources.py tests/test_trace_source_selection.py
      - name: Commit source-quality fixes
        shell: bash
        run: |
          rm .github/workflows/patch-sft-sources-temp.yml scripts/_patch_sft_sources_temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/prepare_reasoning_sft.py scripts/prepare_trace_corpus.py \
                  docs/corpus_8k_agent_data.md docs/corpus_curriculum.md \
                  tests/test_reasoning_sft_sources.py tests/test_trace_source_selection.py \
                  .github/workflows/patch-sft-sources-temp.yml scripts/_patch_sft_sources_temp.py
          git commit -m "Tighten SFT source verification and provenance"
          git push origin HEAD:codex/sft-source-quality-fixes
