name: reference-tests

on:
  workflow_dispatch:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test reference implementation
        env:
          JAX_PLATFORMS: cpu
        run: pytest -q
      - name: Test 8-device MoE and query sampling sharding
        env:
          JAX_PLATFORMS: cpu
          XLA_FLAGS: --xla_force_host_platform_device_count=8
        run: >-
          pytest -q tests/test_operator_pass.py tests/test_indexer_query_budget.py
          -k "dropless_expert_forward_and_backward or router_loads_cross_outer_2x4_into_flat_tp or context_sharded_query_budget"
      - name: Build and parse Kaggle notebook
        env:
          JAX_PLATFORMS: cpu
        run: |
          python scripts/build_notebook.py --output /tmp/nano_dsv41f_kaggle.ipynb
          python - <<'PY'
          import nbformat
          path = '/tmp/nano_dsv41f_kaggle.ipynb'
          nb = nbformat.read(path, as_version=4)
          nbformat.validate(nb)
          assert len(nb.cells) >= 4
          print(f'validated {path}: {len(nb.cells)} cells')
          PY
