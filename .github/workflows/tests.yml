name: reference-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test reference implementation
        env:
          JAX_PLATFORMS: cpu
        run: pytest -q
      - name: Build and parse Kaggle notebook
        env:
          JAX_PLATFORMS: cpu
        run: |
          python scripts/build_notebook.py --output /tmp/nano_dsv41f_kaggle.ipynb
          python - <<'PY'
          import nbformat
          path = '/tmp/nano_dsv41f_kaggle.ipynb'
          nb = nbformat.read(path, as_version=4)
          nbformat.validate(nb)
          assert len(nb.cells) > 10
          joined = '\n'.join(cell.source for cell in nb.cells)
          assert 'init_model_sharded_mixed_precision' in joined
          assert 'make_v5e_sharded_local_mqa' in joined
          assert '%pip install -q -e . --no-deps' in joined
          print(f'validated {path}: {len(nb.cells)} cells')
          PY
