name: reference-tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test combined TPU changes
        env:
          JAX_PLATFORMS: cpu
        run: pytest -q tests/test_sequence_packing.py tests/test_tpu_multi_expert.py
      - name: Parse combined Kaggle notebook
        env:
          JAX_PLATFORMS: cpu
        run: |
          python - <<'PY'
          import nbformat
          path = 'notebooks/nano_dsv41f_combined_smoke.ipynb'
          nb = nbformat.read(path, as_version=4)
          nbformat.validate(nb)
          assert any('run_combined_tpu_smoke.py' in ''.join(cell.get('source', '')) for cell in nb.cells)
          print(f'validated {path}: {len(nb.cells)} cells')
          PY
